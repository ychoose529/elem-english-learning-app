name: 自動雲端編譯 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'

      - name: 下載依賴套件
        run: flutter pub get

      - name: 全域強制將 jcenter() 替換為 mavenCentral()
        run: |
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

      - name: 建置 APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 釋出並提供 APK 下載
        uses: actions/upload-artifact@v4
        with:
          name: English-Learning-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk